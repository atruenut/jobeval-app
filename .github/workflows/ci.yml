name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: eval-cli-${{ matrix.os }}
          path: build/eval-cli

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: eval-cli-windows
          path: build/eval-cli.exe

  # The Qt desktop app: Linux build (headless smoke test) and a Windows build packaged as a
  # self-contained zip that can be downloaded from the run's artifacts.
  app-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Build
        run: |
          cmake -S . -B build -DJOBEVAL_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Smoke test (offscreen)
        run: QT_QPA_PLATFORM=offscreen ./build/app/jobeval --screenshot /tmp/shot.png --page region
      - uses: actions/upload-artifact@v4
        with:
          name: region-screenshot
          path: /tmp/shot.png

  app-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DJOBEVAL_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist/JobEvaluator
          cp build/app/jobeval.exe dist/JobEvaluator/
          windeployqt-qt6 --release --no-translations dist/JobEvaluator/jobeval.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JobEvaluator-windows
          path: dist/JobEvaluator

  # Verifies the REAL published catalog with the app's own verifier: signature made by
  # actual minisign, hashes of every pack, then installs a pack into a fresh cache and
  # evaluates it. Catches any format drift between the data repo and this engine.
  live-catalog:
    runs-on: ubuntu-latest
    env:
      SITE: https://atruenut.github.io/jobeval-data
      PACK_SIGNING_PUBLIC_KEY: RWTO7IvPGG06wlW/mdSpbzkrKXHcF9xgPI5AOWBeei+EJPZ/dQw16RrC
    steps:
      - uses: actions/checkout@v4
      - name: Build eval-cli
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJOBEVAL_BUILD_TESTS=OFF
          cmake --build build --target eval-cli -j
      - name: Download the published catalog
        run: |
          mkdir -p site/packs
          curl -fsSL -o site/index.json "$SITE/index.json"
          curl -fsSL -o site/index.json.minisig "$SITE/index.json.minisig"
          for f in $(python3 -c "import json; print(' '.join(p['file'] for p in json.load(open('site/index.json'))['packs']))"); do
            curl -fsSL -o "site/$f" "$SITE/$f"
          done
      - name: Verify signature and pack hashes
        run: build/eval-cli verify-catalog --pubkey "$PACK_SIGNING_PUBLIC_KEY" site
      - name: Install and evaluate from a fresh cache
        run: |
          build/eval-cli install CA-NB-2026 --source site --cache cache --pubkey "$PACK_SIGNING_PUBLIC_KEY"
          build/eval-cli eval CA-NB-2026 --cache cache --date 2026-11-10 \
            --input gross_annual=50000 --input wage=20 | tee out.txt
          grep -E '^cpp.base +2766.75$' out.txt
